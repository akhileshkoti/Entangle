<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Entangle - Devices</title>
<link rel="stylesheet" href="/static/style.css">
<script>
// Backward-compat with ws-scrcpy-style links, e.g.:
// http://host:8000/#!action=stream&udid=<serial>&player=mse&ws=...
// Only the udid is meaningful here -- the rest is ws-scrcpy's own
// proxy-adb wiring, which Entangle doesn't need.
(function () {
  var hash = location.hash;
  if (hash.indexOf('#!') !== 0) return;
  var params = new URLSearchParams(hash.slice(2));
  var udid = params.get('udid');
  if (params.get('action') === 'stream' && udid) {
    location.replace('/d/' + encodeURIComponent(udid) + '/');
  }
})();
</script>
</head>
<body class="devices-page">
<h1>Devices</h1>
<ul id="device-list" class="device-list"><li class="empty">Loading...</li></ul>
<div class="section-header">
  <h1 class="section-heading">Laptops (VNC)</h1>
  <button id="open-remote-btn" type="button">+ Open remote device</button>
</div>
<ul id="vnc-list" class="device-list"><li class="empty">Loading...</li></ul>

<dialog id="open-remote-dialog">
  <form id="open-remote-form" method="dialog">
    <h2>Open remote device</h2>
    <label>IP address or hostname
      <input name="host" required autocomplete="off" placeholder="192.168.1.42" spellcheck="false">
    </label>
    <label>Port
      <input name="port" type="number" min="1" max="65535" value="5900">
    </label>
    <label>Device name <span class="hint">(optional)</span>
      <input name="devicename" autocomplete="off" placeholder="Shown as the page title">
    </label>
    <label>Username <span class="hint">(macOS only)</span>
      <input name="username" autocomplete="off" spellcheck="false">
    </label>
    <label>Password
      <input name="password" type="password" autocomplete="off">
    </label>
    <div class="dialog-buttons">
      <button type="button" id="open-remote-cancel">Cancel</button>
      <button type="submit" class="primary">Connect</button>
    </div>
  </form>
</dialog>
<script src="/static/devices.js"></script>
<script type="module" src="/static/vnc_hosts.js"></script>
</body>
</html>
